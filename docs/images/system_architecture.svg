  <text x="384" y="995" text-anchor="middle" font-size="12" fill="#5B21B6">自动导航</text>
  <text x="562" y="995" text-anchor="middle" font-size="12" fill="#5B21B6">地图测绘</text>
  <text x="740" y="995" text-anchor="middle" font-size="12" fill="#5B21B6">集群控制</text>
